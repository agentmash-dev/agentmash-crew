name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, check and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Unit tests (bundle, installer, crew-guard hook, lab consistency)
        run: npm test

      - name: Bundle is up to date, protocol summaries in sync, crew and lab agents lint clean
        run: npm run check

      # Manifest validation needs no Claude account; the CLI version is pinned so results are reproducible.
      - name: Validate plugin
        run: npx -y @anthropic-ai/claude-code@2.1.283 plugin validate --strict plugin

      - name: Validate lab plugin
        run: npx -y @anthropic-ai/claude-code@2.1.283 plugin validate --strict lab

      - name: Validate agentmash plugin
        run: npx -y @anthropic-ai/claude-code@2.1.283 plugin validate --strict agentmash

      - name: Validate marketplace
        run: npx -y @anthropic-ai/claude-code@2.1.283 plugin validate --strict .
